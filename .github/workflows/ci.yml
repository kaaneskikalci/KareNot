name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/KareNot.Tests/KareNot.Tests.csproj

      - name: Test
        run: >
          dotnet test tests/KareNot.Tests/KareNot.Tests.csproj -c Release --no-restore
          --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Publish app
        run: dotnet publish KareNot.csproj -c Release -o yayin

      - name: Upload KareNot.exe
        uses: actions/upload-artifact@v4
        with:
          name: KareNot-${{ github.sha }}
          path: yayin/KareNot.exe
          retention-days: 14

  iina-format:
    name: IINA plugin format tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node iina/test/format_test.js
